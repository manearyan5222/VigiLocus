services:
  - type: web
    name: vigilocus-vnm8
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./vigilocus.db
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: "true"
